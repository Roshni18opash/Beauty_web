<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramide Cosmetic - Seasons Sales</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="seasons-sales-section">
        <div class="seasons-sales-container">
            
            <!-- Left Column: Countdown Banner -->
            <div class="countdown-banner-card">
                <div class="countdown-content">
                    <span class="countdown-subtitle">Countdown Is On</span>
                    <h2 class="countdown-title">Holiday Season Sale</h2>
                    
                    <!-- Timer displays days, hours, minutes, seconds separated by colons -->
                    <div class="countdown-timer" id="countdown-timer">
                        <div class="timer-segment">
                            <span class="timer-value" id="days">27</span>
                        </div>
                        <span class="timer-separator">:</span>
                        <div class="timer-segment">
                            <span class="timer-value" id="hours">12</span>
                        </div>
                        <span class="timer-separator">:</span>
                        <div class="timer-segment">
                            <span class="timer-value" id="minutes">47</span>
                        </div>
                        <span class="timer-separator">:</span>
                        <div class="timer-segment">
                            <span class="timer-value" id="seconds">13</span>
                        </div>
                    </div>
                    
                    <a href="#" class="shop-sale-btn">Shop The Sale</a>
                </div>
            </div>

            <!-- Right Column: Categories Grid (4x3 layout) -->
            <div class="categories-grid">
                
                <!-- Row 1 -->
                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="serum.webp" alt="Serums">
                    </div>
                    <span class="category-label">Serums</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="Cleansers.webp" alt="Cleansers">
                    </div>
                    <span class="category-label">Cleansers</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="shampoo.webp" alt="Shampoo">
                    </div>
                    <span class="category-label">Shampoo</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="moisturizers.webp" alt="Moisturizers">
                    </div>
                    <span class="category-label">Moisturizers</span>
                </div>

                <!-- Row 2 -->
                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="Toners.webp" alt="Toners">
                    </div>
                    <span class="category-label">Toners</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="mask.webp" alt="Masks">
                    </div>
                    <span class="category-label">Masks</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="Blush.webp" alt="Blush">
                    </div>
                    <span class="category-label">Blush</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="makeup.webp" alt="Makeup">
                    </div>
                    <span class="category-label">Makeup</span>
                </div>

                <!-- Row 3 -->
                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="scrub.webp" alt="Skincare">
                    </div>
                    <span class="category-label">Skincare</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="Candles.webp" alt="Candles">
                    </div>
                    <span class="category-label">Candles</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="Treatements.webp" alt="Treatments">
                    </div>
                    <span class="category-label">Treatments</span>
                </div>

                <div class="category-card">
                    <div class="category-img-wrapper">
                        <img src="lipsticks.webp" alt="Lipsticks">
                    </div>
                    <span class="category-label">Lipsticks</span>
                </div>

            </div>

        </div>
    </section>

    <!-- JavaScript script -->
    <script src="script.js"></script>
</body>
</html>
