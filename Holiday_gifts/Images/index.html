<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop exclusive Holiday Gift sets — save up to 40% on curated beauty collections.">
    <title>Holiday Gifts - Beauty Collection</title>

    <!-- ── Google Fonts: same as Review section (Figtree + Fraunces) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <!-- ── Bootstrap 5 CSS ── -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ── Custom CSS ── -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         HOLIDAY GIFTS SECTION
         ══════════════════════════════════════════════════════ -->
    <section class="gifts-section py-5" id="gifts-section" aria-label="Holiday Gifts">
        <div class="container">

            <!-- Section Header -->
            <header class="gifts-header mb-4">
                <h1 class="gifts-title">Holiday Gifts</h1>
                <p class="gifts-subtitle">Curated beauty sets, beautifully wrapped.</p>
            </header>

            <!-- ── Slider Wrapper ── -->
            <div class="gifts-slider-wrapper">

                <!-- Prev Arrow (shown only when slider is active) -->
                <button class="slider-arrow slider-arrow--prev" id="slider-prev" aria-label="Previous slide">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <!-- ── Slider Track: gift cards injected here by script.js ── -->
                <div class="gifts-track" id="gifts-track">
                    <!-- Gift cards are injected dynamically via JavaScript -->
                </div>

                <template id="gift-card-template">
                    <div class="gift-card">
                        <div class="gift-card__img-wrap">
                            <img class="gift-card__img" src="" alt="" loading="lazy">
                            <div class="gift-card__overlay"></div>
                        </div>

                        <div class="gift-card__content">
                            <div class="gift-card__top">
                                <span class="gift-card__category"></span>

                                <div class="gift-card__badge">
                                    <span class="gift-card__badge-save">Save</span>
                                    <span class="gift-card__badge-pct"></span>
                                </div>
                            </div>

                            <div class="gift-card__bottom">
                                <h2 class="gift-card__heading"></h2>
                                <a href="#" class="shop-now-btn">Shop Now</a>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Next Arrow -->
                <button class="slider-arrow slider-arrow--next" id="slider-next" aria-label="Next slide">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

            </div>

            <!-- Dot indicators (shown only when slider is active) -->
            <div class="slider-dots" id="slider-dots" aria-label="Slide indicators"></div>

        </div>
    </section>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
