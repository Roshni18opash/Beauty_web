<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Beauty Care - Image Cards</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="beauty-cards-section">
        <div class="beauty-cards-container">
            
            <!-- Card 1: Skin Care -->
            <div class="beauty-card" id="card-skincare">
                <div class="card-image-section" style="background-image: url('Images/imgcard-1.webp');">
                    <div class="card-text-overlay">
                        <span class="card-subtitle">Skin Care</span>
                        <h3 class="card-title">Material Natural</h3>
                    </div>
                </div>
                <div class="card-bottom-section">
                    <div class="product-info">
                        <div class="product-thumbnail">
                            <img src="Images/smallimgcard-1.webp" alt="Liqid Foundation">
                        </div>
                        <div class="product-details">
                            <h4 class="product-title">Liqid Foundation</h4>
                            <span class="product-price">$35.00</span>
                        </div>
                    </div>
                    <a href="#" class="shop-btn" aria-label="Shop Liqid Foundation">
                        <span>Shop</span>
                    </a>
                </div>
            </div>

            <!-- Card 2: Lip Balm -->
            <div class="beauty-card" id="card-lipbalm">
                <div class="card-image-section" style="background-image: url('Images/imgcard-2.webp');">
                    <div class="card-text-overlay">
                        <span class="card-subtitle">Lip Balm</span>
                        <h3 class="card-title">Organic Substance</h3>
                    </div>
                </div>
                <div class="card-bottom-section">
                    <div class="product-info">
                        <div class="product-thumbnail">
                            <img src="Images/smallimgcard-2.webp" alt="Colorful Pencil">
                        </div>
                        <div class="product-details">
                            <h4 class="product-title">Colorful Pencil</h4>
                            <span class="product-price">$25.00</span>
                        </div>
                    </div>
                    <a href="#" class="shop-btn" aria-label="Shop Colorful Pencil">
                        <span>Shop</span>
                    </a>
                </div>
            </div>

            <!-- Card 3: Makeup Tips -->
            <div class="beauty-card" id="card-makeuptips">
                <div class="card-image-section" style="background-image: url('Images/imgcard-3.webp');">
                    <div class="card-text-overlay">
                        <span class="card-subtitle">Makeup Tips</span>
                        <h3 class="card-title">Natural Texture</h3>
                    </div>
                </div>
                <div class="card-bottom-section">
                    <div class="product-info">
                        <div class="product-thumbnail">
                            <img src="Images/smallimgcard-3.webp" alt="Detox Mask">
                        </div>
                        <div class="product-details">
                            <h4 class="product-title">Detox Mask</h4>
                            <span class="product-price">$34.00</span>
                        </div>
                    </div>
                    <a href="#" class="shop-btn" aria-label="Shop Detox Mask">
                        <span>Shop</span>
                    </a>
                </div>
            </div>

            <!-- Card 4: Body Scrub -->
            <div class="beauty-card" id="card-bodyscrub">
                <div class="card-image-section" style="background-image: url('Images/imgcard-4.webp');">
                    <div class="card-text-overlay">
                        <span class="card-subtitle">Body Scrub</span>
                        <h3 class="card-title">Spa Treatment</h3>
                    </div>
                </div>
                <div class="card-bottom-section">
                    <div class="product-info">
                        <div class="product-thumbnail">
                            <img src="Images/smallimgcard-4.webp" alt="Hydrate...">
                        </div>
                        <div class="product-details">
                            <h4 class="product-title">Hydrate...</h4>
                            <span class="product-price">$40.00</span>
                        </div>
                    </div>
                    <a href="#" class="shop-btn" aria-label="Shop Hydrate...">
                        <span>Shop</span>
                    </a>
                </div>
            </div>

        </div>
    </section>

    <!-- JavaScript script -->
    <script src="script.js"></script>
</body>
</html>
