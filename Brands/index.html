<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop By Brands | Premium Skincare & Cosmetics</title>
    <meta
      name="description"
      content="Shop your favorite skincare, cosmetics, and beauty brands. Explore our curated selection of high-quality products."
    />
    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <!-- Component Presentation View -->
      <div class="component-presentation">
        <!-- Header Section -->
        <header class="brands-header">
          <h1 class="brands-title">Shop By Brands</h1>
          <div class="brands-header-right">
            <a
              href="#"
              class="shop-brands-link"
              id="link-shop-all-brands"
              aria-label="Shop all brands"
            >
              Shop All Brands
              <span class="arrow-icon" aria-hidden="true">&#10095;</span>
            </a>
          </div>
        </header>

        <!-- Brands Swiper Container -->
        <section class="brands-swiper-container">
          <div class="swiper brands-swiper layout-grid" id="brands-swiper">
            <div class="swiper-wrapper">
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-olivea"
                aria-label="Shop Olivea products"
              >
                <img
                  src="images/s-brand-logo-1.avif"
                  alt="Olivea Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-libreria"
                aria-label="Shop Libreria products"
              >
                <img
                  src="images/s-brand-logo-2.avif"
                  alt="Libreria Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-blanca"
                aria-label="Shop Blanca products"
              >
                <img
                  src="images/s-brand-logo-3.avif"
                  alt="Blanca Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-lalibu"
                aria-label="Shop Lalibu products"
              >
                <img
                  src="images/s-brand-logo-4.avif"
                  alt="Lalibu Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-glowaura"
                aria-label="Shop Glowaura products"
              >
                <img
                  src="images/s-brand-logo-5.avif"
                  alt="Glowaura Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-avocado"
                aria-label="Shop Avocado products"
              >
                <img
                  src="images/s-brand-logo-6.avif"
                  alt="Avocado Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-ceramide"
                aria-label="Shop Ceramide Cosmetic products"
              >
                <img
                  src="images/s-brand-logo-7.avif"
                  alt="Ceramide Cosmetic Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-sometimes"
                aria-label="Shop Some Times products"
              >
                <img
                  src="images/s-brand-logo-8.avif"
                  alt="Some Times Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-amore"
                aria-label="Shop Amore products"
              >
                <img
                  src="images/s-brand-logo-9.avif"
                  alt="Amore Logo"
                  loading="lazy"
                />
              </a>
              <a
                href="#"
                class="swiper-slide brand-item"
                id="brand-goodness"
                aria-label="Shop Goodness products"
              >
                <img
                  src="images/s-brand-logo-10.avif"
                  alt="Goodness Logo"
                  loading="lazy"
                />
              </a>
            </div>

            <!-- Swiper Navigation (Arrows) -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

            <!-- Swiper Pagination (Bullets) -->
            <div class="swiper-pagination"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
