<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Slider</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-5">
        <div class="category-slider-container position-relative">
            <!-- Swiper -->
            <div class="swiper mySwiper category-swiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1: Sale -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <span class="sale-badge">Sale</span>
                            </div>
                            <span class="category-text text-dark">Sale Items</span>
                        </a>
                    </div>
                    <!-- Slide 2 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-2.webp" alt="Best Sellers" class="category-img">
                            </div>
                            <span class="category-text text-dark">Best Sellers</span>
                        </a>
                    </div>
                    <!-- Slide 3 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-3.webp" alt="Gift Sets" class="category-img">
                            </div>
                            <span class="category-text text-dark">Gift Sets</span>
                        </a>
                    </div>
                    <!-- Slide 4 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-4.webp" alt="New Arrivals" class="category-img">
                            </div>
                            <span class="category-text text-dark">New Arrivals</span>
                        </a>
                    </div>
                    <!-- Slide 5 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-5.webp" alt="Skincare" class="category-img">
                            </div>
                            <span class="category-text text-dark">Skincare</span>
                        </a>
                    </div>
                    <!-- Slide 6 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-6.avif" alt="Makeup" class="category-img">
                            </div>
                            <span class="category-text text-dark">Makeup</span>
                        </a>
                    </div>
                    <!-- Slide 7 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-7.webp" alt="Hair" class="category-img">
                            </div>
                            <span class="category-text text-dark">Hair</span>
                        </a>
                    </div>
                    <!-- Slide 8 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-8.webp" alt="Brands" class="category-img">
                            </div>
                            <span class="category-text text-dark">Brands</span>
                        </a>
                    </div>
                    <!-- Slide 9 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-9.webp" alt="More" class="category-img">
                            </div>
                            <span class="category-text text-dark">Body</span>
                        </a>
                    </div>
                    <!-- Slide 10 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-10.webp" alt="Fragrance" class="category-img">
                            </div>
                            <span class="category-text text-dark">Sunscreen</span>
                        </a>
                    </div>
                    <!-- Slide 11 -->
                    <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-11.jpg" alt="Tools" class="category-img">
                            </div>
                            <span class="category-text text-dark">Gift Sets</span>
                        </a>
                    </div>
                    <!-- Slide 12 -->
                     <div class="swiper-slide text-center">
                        <a href="#" class="category-item text-decoration-none">
                            <div class="category-img-wrapper d-flex align-items-center justify-content-center mx-auto mb-2">
                                <img src="images/c-12.jpg" alt="Tools" class="category-img">
                            </div>
                            <span class="category-text text-dark">New Arrivals</span>
                        </a>
                    </div>

                </div>
            </div>
            
            <!-- Navigation buttons -->
            <div class="swiper-button-prev custom-nav-btn"></div>
            <div class="swiper-button-next custom-nav-btn"></div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 2,
            spaceBetween: 10,
            slidesPerGroup: 1, // Move one by one
            loop: false, // Don't loop to previous items at start
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            breakpoints: {
                576: {
                    slidesPerView: 3,
                    spaceBetween: 10,
                },
                768: {
                    slidesPerView: 5,
                    spaceBetween: 15,
                },
                992: {
                    slidesPerView: 7,
                    spaceBetween: 20,
                },
                1200: {
                    slidesPerView: 8,
                    spaceBetween: 20,
                },
            },
        });
    </script>
</body>
</html>
