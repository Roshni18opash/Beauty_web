<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dynamic Beauty Features - Check Buttons Section">
    <title>Beauty Shine - Features</title>

    <!-- ── Google Fonts (Figtree for UI text, Fraunces for editorial headings) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">

    <!-- ── Bootstrap 5 CSS ── -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ── Custom CSS ── -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         CHECK BUTTONS SECTION
         ══════════════════════════════════════════════════════ -->
    <section class="features-section py-5" id="features-section" aria-label="Store Benefits">
        <div class="container text-center">

            <!-- Section Title / Heading -->
            <h1 class="features-title mx-auto">
                Take the time you
                <span class="highlight-wrapper">
                    <em class="highlight-text">deserve</em>
                    <svg class="oval-stroke" viewBox="0 0 100 40" fill="none" preserveAspectRatio="none" aria-hidden="true">
                        <!-- Custom hand-drawn style peach/rose loop path -->
                        <path d="M 5,22 C 3,12 25,4 65,4 C 95,4 98,12 95,20 C 90,28 55,36 25,36 C 8,36 3,28 15,20 C 25,12 60,6 90,8" stroke="#fbc5c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </span>, and let beauty shine within you
            </h1>

            <!-- ── Buttons/Cards Wrapper ── -->
            <div class="features-slider-wrapper mx-auto">

                <!-- ── Flex Track Container (Static items) ── -->
                <div class="features-track" id="features-track">
                    <!-- Free Shipping -->
                    <div class="check-btn" role="button" tabindex="0" aria-label="Free Shipping">
                        <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Free Shipping</span>
                    </div>

                    <!-- Money Guarantee -->
                    <div class="check-btn" role="button" tabindex="0" aria-label="Money Guarantee">
                        <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Money Guarantee</span>
                    </div>

                    <!-- Flexible Payment -->
                    <div class="check-btn" role="button" tabindex="0" aria-label="Flexible Payment">
                        <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Flexible Payment</span>
                    </div>

                    <!-- Online Support -->
                    <div class="check-btn" role="button" tabindex="0" aria-label="Online Support">
                        <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Online Support</span>
                    </div>

                    <!-- Return Within 7 Days -->
                    <div class="check-btn" role="button" tabindex="0" aria-label="Return Within 7 Days">
                        <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Return Within 7 Days</span>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
