<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Button Slider</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-5">
        <div class="category-slider-container position-relative">
            <!-- Swiper -->
            <div class="swiper mySwiper category-swiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1: Sale Items -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <span class="sale-badge-pill">Sale</span>
                            </div>
                            <span class="category-pill-text">Sale Items</span>
                        </a>
                    </div>
                    <!-- Slide 2: Lip Scrubs -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-1.avif" alt="Lip Scrubs" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Lip Scrubs</span>
                        </a>
                    </div>
                    <!-- Slide 3: Matte Lipsticks -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-2.webp" alt="Matte Lipsticks" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Matte Lipsticks</span>
                        </a>
                    </div>
                    <!-- Slide 4: Foundations -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-3.webp" alt="Foundations" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Foundations</span>
                        </a>
                    </div>
                    <!-- Slide 5: Sensitive Toner -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-4.webp" alt="Sensitive Toner" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Sensitive Toner</span>
                        </a>
                    </div>
                    <!-- Slide 6: Makeup Remove -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-6.avif" alt="Makeup Remove" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Makeup Remove</span>
                        </a>
                    </div>
                    <!-- Slide 7: Makeup Tools -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-7.webp" alt="Makeup Tools" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Makeup Tools</span>
                        </a>
                    </div>
                    <!-- Slide 8: Skincare -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-5.webp" alt="Skincare" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Skincare</span>
                        </a>
                    </div>
                    <!-- Slide 9: Hydrating Serum -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-8.webp" alt="Hydrating Serum" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Hydrating Serum</span>
                        </a>
                    </div>
                    <!-- Slide 10: Body Care -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-9.webp" alt="Body Care" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Body Care</span>
                        </a>
                    </div>
                    <!-- Slide 11: Sunscreen -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-10.webp" alt="Sunscreen" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Sunscreen</span>
                        </a>
                    </div>
                    <!-- Slide 12: Gift Sets -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-11.jpg" alt="Gift Sets" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Gift Sets</span>
                        </a>
                    </div>
                    <!-- Slide 13: New Arrivals -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/c-12.jpg" alt="New Arrivals" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">New Arrivals</span>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Navigation buttons -->
            <div class="swiper-button-prev custom-nav-btn"></div>
            <div class="swiper-button-next custom-nav-btn"></div>
            
            <!-- Fading Overlay -->
            <div class="category-fade-overlay"></div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 1.5,
            spaceBetween: 10,
            slidesPerGroup: 1, // Move one by one
            loop: false, // Don't loop to previous items at start
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            breakpoints: {
                480: {
                    slidesPerView: 2.2,
                    spaceBetween: 12,
                },
                576: {
                    slidesPerView: 3.2,
                    spaceBetween: 15,
                },
                768: {
                    slidesPerView: 4.2,
                    spaceBetween: 15,
                },
                992: {
                    slidesPerView: 5.2,
                    spaceBetween: 20,
                },
                1200: {
                    slidesPerView: 6.5,
                    spaceBetween: 20,
                },
            },
        });
    </script>
</body>
</html>
