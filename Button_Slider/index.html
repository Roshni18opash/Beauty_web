<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Button Slider</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-5">
        <div class="category-slider-container position-relative">
            <!-- Swiper -->
            <div class="swiper mySwiper category-swiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1: Sale Items -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                         <img src="images/makeup.avif" alt="Lip Scrubs" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Sale Items</span>
                        </a>
                    </div>
                    <!-- Slide 2: Lip Scrubs -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/lip.webp" alt="Lip Scrubs" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Lip Scrubs</span>
                        </a>
                    </div>
                    <!-- Slide 3: Matte Lipsticks -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/lipstick.avif" alt="Matte Lipsticks" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Matte Lipsticks</span>
                        </a>
                    </div>
                    <!-- Slide 4: Foundations -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/foundation.webp" alt="Foundations" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Foundations</span>
                        </a>
                    </div>
                    <!-- Slide 5: Sensitive Toner -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/oil.avif" alt="Sensitive Toner" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Sensitive Toner</span>
                        </a>
                    </div>
                    <!-- Slide 6: Hydrating Cream -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/hydrate_cream.webp" alt="Hydrating Cream" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Hydrating Cream</span>
                        </a>
                    </div>
                    <!-- Slide 7: Makeup Tools -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/makeuptool.webp" alt="Makeup Tools" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Makeup Tools</span>
                        </a>
                    </div>
                    <!-- Slide 8: Makeup Artistry -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/makeup.avif" alt="Makeup Artistry" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Makeup Artistry</span>
                        </a>
                    </div>
                    <!-- Slide 9: Lip Balm -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/lip.webp" alt="Lip Balm" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Lip Balm</span>
                        </a>
                    </div>
                    <!-- Slide 10: Lipstick Matte -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/lipstick.avif" alt="Lipstick Matte" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Lipstick Matte</span>
                        </a>
                    </div>
                    <!-- Slide 11: Foundation Base -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/foundation.webp" alt="Foundation Base" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Foundation Base</span>
                        </a>
                    </div>
                    <!-- Slide 12: Night Moisture -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/hydrate_cream.webp" alt="Night Moisture" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Night Moisture</span>
                        </a>
                    </div>
                    <!-- Slide 13: Makeup Palette -->
                    <div class="swiper-slide">
                        <a href="#" class="category-pill-item">
                            <div class="category-pill-img-wrapper">
                                <img src="images/makeup.avif" alt="Makeup Palette" class="category-pill-img">
                            </div>
                            <span class="category-pill-text">Makeup Palette</span>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Navigation buttons -->
            <div class="swiper-button-prev custom-nav-btn"></div>
            <div class="swiper-button-next custom-nav-btn"></div>
            
            <!-- Fading Overlay -->
            <div class="category-fade-overlay"></div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 1.5,
            spaceBetween: 10,
            slidesPerGroup: 1, // Move one by one
            loop: false, // Don't loop to previous items at start
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            breakpoints: {
                480: {
                    slidesPerView: 2.2,
                    spaceBetween: 12,
                },
                576: {
                    slidesPerView: 3.2,
                    spaceBetween: 15,
                },
                768: {
                    slidesPerView: 4.2,
                    spaceBetween: 15,
                },
                992: {
                    slidesPerView: 5.2,
                    spaceBetween: 20,
                },
                1200: {
                    slidesPerView: 6.5,
                    spaceBetween: 20,
                },
            },
        });
    </script>
</body>
</html>
