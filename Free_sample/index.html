<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get free 5 makeup samples with every order over $100. Limited time offer.">
    <title>Free Makeup Samples - Limited Time Offer</title>

    <!-- ── Google Fonts: Fraunces (heading) + Figtree (body) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <!-- ── Bootstrap 5 CSS ── -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ── Custom CSS ── -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         FREE MAKEUP SAMPLES — PROMO BANNER SECTION
         ══════════════════════════════════════════════════════ -->
    <section class="promo-section" id="promo-section" aria-label="Free Makeup Samples Offer">
        <div class="container">

            <!-- ── Banner Card ── -->
            <div class="promo-banner">

                <!-- Column 1: "For A Limited Time" label (italic serif) -->
                <div class="promo-label-wrap">
                    <span class="promo-label" id="promo-label">For A Limited Time</span>
                </div>

                <!-- Column 2: Main Heading -->
                <div class="promo-heading-wrap">
                    <h1 class="promo-heading" id="promo-heading">Free Makeup Samples</h1>
                </div>

                <!-- Column 3: Description text -->
                <div class="promo-desc-wrap">
                    <p class="promo-desc" id="promo-desc">
                        Free 5 makeup samples with every order over $100
                    </p>
                </div>

                <!-- Column 4: Shop Now Button -->
                <div class="promo-btn-wrap">
                    <button
                        class="promo-btn"
                        id="promo-shop-now-btn"
                        type="button"
                        aria-label="Shop now for free makeup samples"
                    >
                        Shop Now
                    </button>
                </div>

            </div>
            <!-- /promo-banner -->

        </div>
    </section>

    <!-- ── Bootstrap 5 Bundle JS ── -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ── Custom JS ── -->
    <script src="script.js"></script>
</body>
</html>
