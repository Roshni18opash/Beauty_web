{{$collection= system.collection.get_collection(&tab_coll)}}
{{$collection_prods= system.collection.get_collection_products(&tab_coll)}}
{{with each $collection_prods as $collection}} {{$prods =
system.product.get_product($collection)}}
<article class="product-card">
  <div class="card-image-box">
    <div class="image-wrapper">
      <img
        class="img-main"
        src="https://cdn.flicksell.com/{{= $prods['main_img']}}"
        alt="{{= $prods['name']}}"
      />
      <img
        class="img-alt"
        src="https://cdn.flicksell.com/{{= $prods['images'][1]}}"
        alt="{{= $prods['name']}} Hover"
      />
      <img
        class="img-main"
        src="../Images/HydrateSmoothingSerum-42.webp"
        alt="Hydrate Smoothing Serum"
      />
      <img
        class="img-hover"
        src="../Images/HydrateSmoothingSerum-42a.webp"
        alt="Hydrate Smoothing Serum Alternate"
      />
    </div>
    <!-- Hover Quick View Button -->
    <button class="btn-quick-view" type="button" aria-label="Quick View">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
    <!-- Hover Add to Cart Button -->
    <button class="btn-add-cart" type="button">
      <span>Add To Cart</span>
    </button>
  </div>
  <div class="card-info">
    <span class="product-category">Face Serums</span>
    <h3 class="product-name">{{= $prods['name']}}</h3>
    <div class="product-price-row">
      <flicksell-template-cart product-id="{{= $collection}}" no-auto-select>
        <flicksell-template-product-price class="discounted-price price-sale">
        </flicksell-template-product-price>
        <flicksell-template-product-mrp
          class="original-price price"
        ></flicksell-template-product-mrp>
      </flicksell-template-cart>
    </div>
  </div>
</article>
