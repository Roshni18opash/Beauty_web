<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover our industry leading products designed to nurture your creative spirit safely and beautifully.">
    <title>Grab The Deals - Beauty Offers</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero-container">
        <!-- Left Content -->
        <div class="hero-content">
            <span class="sub-heading">Grab The Deals</span>
            <div class="heading-wrapper">
                <h1 class="main-heading" id="hero-title">Getting Your<br>Natural Beauty</h1>
            </div>
            <p class="description">
                Our industry leading standards for product safety give<br>
                you the power to make better.
            </p>
            <a href="#" class="shop-btn">Shop Skincare</a>
            
            <!-- Slider Controls -->
            <div class="slider-controls">
                <button class="arrow-btn" id="prev-btn" aria-label="Previous slide">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="dots" id="pagination-dots">
                    <div class="dot active" data-index="0">
                        <div class="progress"></div>
                    </div>
                    <div class="dot" data-index="1">
                        <div class="progress"></div>
                    </div>
                    <div class="dot" data-index="2">
                        <div class="progress"></div>
                    </div>
                </div>
                <button class="arrow-btn" id="next-btn" aria-label="Next slide">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </div>

        <!-- Right Image -->
        <div class="hero-image-wrapper">
            <img src="images/h1.webp" alt="Beauty Product" class="hero-image" id="hero-image">
        </div>

        <!-- Right Banner -->
        <div class="side-banner">
            <span class="badge">4</span>
            <span class="banner-text">Special Offers For You</span>
            <button class="close-banner" aria-label="Close offers">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
